name: Build
on: [ push, pull_request ]

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Build
        id: build
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [[ -n "$SIGNING_KEY" ]]; then
            echo "variant=continuous" >> "$GITHUB_OUTPUT"
            ./gradlew assembleGitContinuous
          else
            echo "variant=debug" >> "$GITHUB_OUTPUT"
            ./gradlew assembleGitDebug
          fi
        working-directory: android
      - name: Sign APK
        if: steps.build.outputs.variant == 'continuous'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/git/continuous
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Android
          path: ${{ steps.build.outputs.variant == 'continuous' && 'android/app/build/outputs/apk/git/continuous/app-git-continuous-unsigned-signed.apk' || 'android/app/build/outputs/apk/git/debug/app-git-debug.apk' }}
  windows:
    name: Windows
    runs-on: windows-latest
    strategy:
      matrix:
        arch: ['x86', 'amd64']
      fail-fast: false
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup Visual Studio
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Configure project
        run: cmake --preset "win32-release-${{ matrix.arch }}"
      - name: Build
        run: cmake --build .
        working-directory: build
      - name: Package
        run: cpack --config CPackConfig.cmake
        working-directory: build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-${{ matrix.arch }}
          path: build/*.zip
  linux:
    name: Linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ['i386', 'amd64']
      fail-fast: false
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install libatomic1:i386 libgcc-s1:i386 \
            libstdc++6:i386 gcc-multilib g++-multilib cmake \
            ninja-build libfontconfig-dev:i386 libfontconfig-dev
      - name: Configure project
        run: cmake --preset "linux-release-${{ matrix.arch }}"
      - name: Build
        run: cmake --build .
        working-directory: build
      - name: Package
        run: cpack --config CPackConfig.cmake
        working-directory: build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-${{ matrix.arch }}
          path: build/*.tar.gz
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [android, windows, linux]
    if: github.event_name == 'push'
    steps:
      - name: Fetch artifacts
        uses: actions/download-artifact@v8

      - name: Remove old release
        uses: ClementTsang/delete-tag-and-release@v0.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name == 'master' && 'continuous' || format('continuous-{0}', github.ref_name) }}
          delete_release: true
          repo: ${{ env.GITHUB_REPOSITORY }}
      - name: Prepare release
        run: |
          mv Android/app-git-continuous-unsigned-signed.apk TF15Client-Android.apk

          mv */*.zip .
          mv */*.tar.gz .

          sleep 60s
      # - name: Purge artifacts
      #   uses: geekyeggo/delete-artifact@v2
      #   with:
      #     name: "*"
      - name: Upload new release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_name: ${{ env.GITHUB_REPOSITORY }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: TF15Client-*
          tag: ${{ github.ref_name == 'master' && 'continuous' || format('continuous-{0}', github.ref_name) }}
          overwrite: true
          prerelease: true
          release_name: TF15Client development build
